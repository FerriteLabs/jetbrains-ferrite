build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 60
  LongParameterList:
    functionThreshold: 6
  ComplexCondition:
    threshold: 4
  TooManyFunctions:
    thresholdInFiles: 30
    thresholdInClasses: 20

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
  WildcardImport:
    active: false
  ReturnCount:
    max: 4

naming:
  FunctionNaming:
    functionPattern: '[a-z][a-zA-Z0-9]*'

formatting:
  active: true
  MaximumLineLength:
    active: true
    maxLineLength: 140
  NoWildcardImports:
    active: true
  TrailingCommaOnCallSite:
    active: false
  TrailingCommaOnDeclarationSite:
    active: false
